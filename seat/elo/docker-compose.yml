# ELO 25 stack from the official ECK images (registry.elo.com, needs an ELO partner/customer registry login).
# Secrets come from .env (generated by elo.sh, git-ignored); the license from ELO_LIC_FILE.
# Requires: docker login registry.elo.com, sysctl vm.max_map_count=262144, ~16 GB RAM for the whole stack.
x-auth: &auth
  AUTH_SERVICE_USERNAME: ${AUTH_SERVICE_USERNAME:-ELO Service}
  AUTH_SERVICE_PASSWORD: ${AUTH_SERVICE_PASSWORD}
x-ix-urls: &ixurls
  REPO_NAME: ${REPO}
  REPO_LANGUAGE: ${REPO_LANGUAGE:-en}
  IX_URL_BASE: http://server:9090/${REPO}/ix
  IX_URL_PRIVATE: http://server:9090/${REPO}/ix
  IX_URL_PUBLIC: ${IX_URL_PUBLIC:-http://localhost:9090/${REPO}/ix}
  ELO_HOST: http://server:9090

services:
  server:
    image: registry.elo.com/eck-services/server:${ELO_TAG}
    container_name: elo-server
    ports: ["9090:9090"]
    environment:
      <<: [*auth, *ixurls]
      IX_APP_PATH: ${REPO}
      ELO_DISPLAY_NAME: ${ELO_DISPLAY_NAME:-${REPO}}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-elodb}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      AUTH_TOMCAT_USERNAME: admin
      AUTH_TOMCAT_PASSWORD: ${AUTH_TOMCAT_PASSWORD}
    networks: { default: { aliases: [ix] } }
    volumes:
      - data-ix:/opt/elo/data/ix
      - data-eloam:/opt/elo/data/eloam
      - repository-system:/opt/elo/archive/elosys
      - repository-basis:/opt/elo/archive/basis
      - certificates-ix:/opt/elo/config/certificates/ix/:ro
      - plugins:/opt/elo/prog/webapps/ix-plugins/public
      - logs:/opt/elo/logs
    depends_on: [postgres]
  ix-setup:
    image: registry.elo.com/eck-services/ix-setup:${ELO_TAG}
    container_name: elo-ix-setup
    environment:
      <<: [*auth, *ixurls]
      ELO_TEXTREADER_URL: http://tr2:8100
      ELO_DISPLAY_NAME: ${ELO_DISPLAY_NAME:-${REPO}}
      ELO_LICENSE_TYPE: ${ELO_LICENSE_TYPE:-0}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-Administrator}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-elodb}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
      ELO_LIC: ${ELO_LIC}
    volumes:
      - data-eloam:/opt/elo/data/eloam
      - data-ix:/opt/elo/data/ix
      - repository-system:/opt/elo/archive/elosys
      - repository-basis:/opt/elo/archive/basis
      - certificates-ix:/opt/elo/config/certificates/ix
      - certificates-search:/opt/elo/config/certificates/search
      - logs:/opt/elo/logs
    depends_on: [postgres]
  ix-import:
    image: registry.elo.com/eck-services/ix-import:${ELO_TAG}
    container_name: elo-ix-import
    environment:
      <<: *auth
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
  # Optional services: enabled through COMPOSE_PROFILES in .env (default "as,flows").
  as:
    image: registry.elo.com/eck-services/as:${ELO_TAG}
    container_name: elo-as
    profiles: [as]
    environment: *auth
    ports: ["9060:9090"]
  search:
    image: registry.elo.com/eck-services/search:${ELO_SEARCH_TAG}
    container_name: elo-search
    ports: ["9200:9200", "9204:9204"]
    environment:
      <<: *auth
      bootstrap.memory_lock: "true"
      AUTH_SERVICE_PASSWORD_BCRYPT: ${AUTH_SERVICE_PASSWORD_BCRYPT}
      KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD}
    volumes:
      - data-search:/opt/elo/data/index
      - certificates-search:/opt/elo/config/certificates/search
      - logs:/opt/elo/logs
  flows:
    image: registry.elo.com/eck-services/flows:${ELO_TAG}
    container_name: elo-flows
    profiles: [flows]
    environment:
      <<: *auth
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
    ports: ["9010:9090"]
    volumes:
      - data-flows:/opt/elo/data/flows/
      - logs:/opt/elo/logs
  flows-worker:
    image: registry.elo.com/eck-services/flows-worker:${ELO_TAG}
    container_name: elo-flows-worker
    profiles: [flows]
    environment:
      <<: *auth
      AUTH_KARAF_PASSWORD: ${AUTH_KARAF_PASSWORD}
      FLOWS_WORKER_HOST: flows-worker
    volumes:
      - logs:/opt/elo/logs
  tr2:
    image: registry.elo.com/eck-services/tr2:${ELO_TAG}
    container_name: elo-tr2
    shm_size: 5g
    environment:
      AUTH_TOMCAT_USERNAME: admin
      AUTH_TOMCAT_PASSWORD: ${AUTH_TOMCAT_PASSWORD}
  postgres:
    image: docker.io/library/postgres:18.4
    container_name: elo-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-elodb}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - data-db:/var/lib/postgresql

volumes:
  repository-system:
  repository-basis:
  data-eloam:
  data-ix:
  data-search:
  data-db:
  plugins:
  certificates-ix:
  certificates-search:
  data-flows:
  logs:
networks:
  default:
    name: elo-network
