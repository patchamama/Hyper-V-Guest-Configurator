<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELO Docker Installer</title>
<script>
  // Theme before first paint: "auto" follows the system; "light"/"dark" are explicit choices (remembered).
  try { const th = localStorage.getItem('elo-theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch {}
</script>
<style>
:root { --bg:#0f141b; --sur:#161d26; --sur2:#1d2632; --border:#2a3646; --text:#e7edf4; --muted:#8c9aab; --accent:#f28c1f;
  --accent2:#5aa2ff; --green:#38c172; --amber:#e3a008; --red:#ef4444; --log:#0a0e13; --logtext:#cfd8e3; --mono:'Cascadia Code',Consolas,monospace; color-scheme: dark; }
:root[data-theme=light] { --bg:#f4f6f9; --sur:#fff; --sur2:#eef2f7; --border:#d6dde6; --text:#1b2430; --muted:#5d6b7c; --accent:#d9730d;
  --accent2:#1d6fe0; --green:#1f8f4e; --amber:#a86d00; --red:#c62828; --log:#1b2430; --logtext:#e7edf4; color-scheme: light; }
@media (prefers-color-scheme: light) { :root:not([data-theme=dark]) { --bg:#f4f6f9; --sur:#fff; --sur2:#eef2f7; --border:#d6dde6; --text:#1b2430;
  --muted:#5d6b7c; --accent:#d9730d; --accent2:#1d6fe0; --green:#1f8f4e; --amber:#a86d00; --red:#c62828; --log:#1b2430; --logtext:#e7edf4; color-scheme: light; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif; }
a { color:var(--accent2); }
header { display:flex; align-items:center; gap:14px; padding:12px 22px; border-bottom:1px solid var(--border); background:var(--sur); flex-wrap:wrap; position:sticky; top:0; z-index:5; }
header .logo { width:28px; height:28px; background:linear-gradient(135deg,#f6a23a,#e2620c); border-radius:4px; flex:none; }
header h1 { font-size:16px; margin:0; }
.tabs { display:flex; gap:4px; flex-wrap:wrap; } .tabs button { background:none; border:0; color:var(--muted); padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
.tabs button.on { background:var(--sur2); color:var(--text); }
.hright { margin-left:auto; display:flex; gap:8px; align-items:center; } .hright select, .hright button { background:var(--sur2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:4px 8px; font-size:12px; cursor:pointer; }
.env { color:var(--muted); font-size:12px; }
main { display:grid; grid-template-columns:240px 1fr; min-height:calc(100vh - 56px); }
main.single { grid-template-columns:1fr; }
@media (max-width: 780px) { main { grid-template-columns:1fr; } nav.steps { display:flex; overflow-x:auto; border-right:0 !important; border-bottom:1px solid var(--border); } }
nav.steps { border-right:1px solid var(--border); padding:16px 10px; background:var(--sur); }
nav.steps div { display:flex; gap:10px; align-items:center; padding:8px 10px; border-radius:8px; cursor:pointer; color:var(--muted); white-space:nowrap; }
nav.steps div.on { background:var(--sur2); color:var(--text); }
nav.steps .n { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; border:1px solid var(--border); font-size:12px; flex:none; }
nav.steps div.done .n { background:var(--green); border-color:var(--green); color:#fff; } nav.steps div.on .n { border-color:var(--accent); color:var(--accent); }
section.page { padding:22px 26px; max-width:1100px; width:100%; }
h2 { margin:0 0 4px; font-size:20px; } .lead { color:var(--muted); margin:0 0 18px; }
.explain { background:var(--sur2); border-left:3px solid var(--accent2); padding:10px 14px; border-radius:6px; margin:0 0 16px; color:var(--muted); font-size:13px; }
.banner { border:1px solid var(--green); background:color-mix(in srgb, var(--green) 10%, var(--sur)); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
.card { background:var(--sur); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
label { display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
input[type=text], input[type=password], input[type=number], select, textarea { width:100%; padding:8px 10px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; font-size:13px; }
button.btn, a.btn { display:inline-block; padding:8px 16px; border-radius:6px; border:1px solid var(--border); background:var(--sur2); color:var(--text); cursor:pointer; font-size:13px; text-decoration:none; }
.primary { background:var(--accent) !important; border-color:var(--accent) !important; color:#fff !important; } .small { padding:3px 9px !important; font-size:12px !important; }
button:disabled { opacity:.5; cursor:default; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .right { margin-left:auto; }
.check { display:grid; grid-template-columns:22px 1fr auto; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); align-items:center; }
.check:last-child { border-bottom:0; } .check .v { color:var(--muted); font-size:12px; text-align:right; }
.dot { width:12px; height:12px; border-radius:50%; display:inline-block; flex:none; } .ok { background:var(--green); } .warn { background:var(--amber); } .bad { background:var(--red); } .idle { background:var(--border); }
.tok { color:var(--green); } .twarn { color:var(--amber); } .tbad { color:var(--red); } .muted { color:var(--muted); font-size:12px; }
table { width:100%; border-collapse:collapse; font-size:13px; } th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:12px; } .tablewrap { overflow-x:auto; }
pre.log { background:var(--log); color:var(--logtext); font:12px/1.45 var(--mono); padding:12px; border-radius:8px; max-height:320px; overflow:auto; white-space:pre-wrap; margin:0; }
.progress { height:8px; background:var(--sur2); border-radius:4px; overflow:hidden; } .progress > div { height:100%; background:var(--accent); width:0; transition:width .4s; }
.steplist div { padding:3px 0; } .steplist div::before { content:'○ '; color:var(--muted); } .steplist div.done::before { content:'● '; color:var(--green); } .steplist div.cur::before { content:'◐ '; color:var(--accent); }
.bar { height:6px; background:var(--sur2); border-radius:3px; overflow:hidden; min-width:80px; } .bar > div { height:100%; background:var(--accent2); }
.pw { font-family:var(--mono); } [hidden] { display:none !important; } code { font-family:var(--mono); font-size:12px; }
.nav { display:flex; justify-content:space-between; margin-top:18px; }
.info { display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; border:1px solid var(--accent2); color:var(--accent2); font-size:11px; font-weight:700; cursor:pointer; margin-left:6px; background:none; padding:0; }
.tcard { margin:0; cursor:pointer; } .tcard.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.tcard.disabled { opacity:.45; cursor:not-allowed; }
.membar { display:flex; height:18px; border-radius:5px; overflow:hidden; margin:10px 0 8px; background:var(--sur2); }
.membar > div { height:100%; min-width:2px; }
.memlegend { gap:6px 16px; font-size:13px; } .memlegend i { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
.mem-wsl { background:#3b82f6; } .mem-hyperv { background:#8b5cf6; } .mem-vbox { background:#14b8a6; } .mem-desktop { background:#f59e0b; }
.mem-system { background:#94a3b8; } .mem-free { background:var(--border); }
.membar .mem-hyperv + .mem-hyperv { border-left:1px solid #fff8; }
.pill { display:inline-block; padding:2px 8px; border:1px solid var(--line, #8884); border-radius:999px; font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="logo"></div><h1 id="h-title"></h1>
  <div class="tabs" id="tabs"></div>
  <div class="hright">
    <span class="env" id="envinfo"></span>
    <select id="lang" onchange="setLang(this.value)"><option value="en">English</option><option value="de">Deutsch</option><option value="es">Español</option></select>
    <button id="themebtn" onclick="cycleTheme()"></button>
  </div>
</header>
<main id="install-view"><nav class="steps" id="steps"></nav><section class="page" id="page"></section></main>
<main id="admin-view" class="single" hidden><section class="page" style="max-width:1250px" id="admin-page"></section></main>
<main id="containers-view" class="single" hidden><section class="page" style="max-width:1250px" id="containers-page"></section></main>
<main id="help-view" class="single" hidden><section class="page" style="max-width:1000px" id="help-page"></section></main>

<script src="i18n.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const api = async (u, body) => (await fetch('/api' + u, body === undefined ? {} : { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })).json().catch(e => ({ ok:false, error:e.message }));
const gb = b => b == null || isNaN(b) ? '' : (b / 1e9).toFixed(2) + ' GB';
const rnd = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'[b % 56]).join('');
const store = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

// ── State ────────────────────────────────────────────────────────────────────
const W = { step: 0, done: new Set(), checks: null, inv: null, license: null, prov: null,
  cfg: { ELO_TAG: 'v25-0.30.1', ELO_SEARCH_TAG: 'v25-0.7', REPO: 'repository', ELO_DISPLAY_NAME: '', REPO_LANGUAGE: 'en', ELO_LICENSE_TYPE: '1',
    AUTH_ADMIN_USERNAME: 'Administrator', AUTH_ADMIN_PASSWORD: rnd(), AUTH_SERVICE_USERNAME: 'ELO Service', AUTH_SERVICE_PASSWORD: rnd(),
    DATABASE_USERNAME: 'elodb', DATABASE_PASSWORD: rnd(), IX_URL_PUBLIC: '', as: true, flows: true, pgadmin: true, fresh: true, eula: true },
  target: 'wsl', vm: { name: 'elo-docker', distro: 'ubuntu', ramGB: 16, cpus: 4, diskGB: 80 } };
// Administration / containers data is cached and only reloaded with Refresh (or after an action).
const CACHE = { status: null, images: null, containers: null, at: {} };
let VIEW = 'install';

const TABS = ['install', 'admin', 'containers', 'help'];
const STEPS = [['step.welcome', welcome], ['step.req', requirements], ['step.registry', registry], ['step.images', images],
  ['step.license', license], ['step.config', config], ['step.install', install], ['step.tests', tests], ['step.access', access]];

// ── Shell: language, theme, tabs ─────────────────────────────────────────────
function setLang(l) { LANG = l; store('elo-lang', l); document.documentElement.lang = l; shell(); show(VIEW, true); }
function themeState() { return document.documentElement.dataset.theme || 'auto'; }
function cycleTheme() {
  const next = { auto: 'light', light: 'dark', dark: 'auto' }[themeState()];
  if (next === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = next;
  store('elo-theme', next); shell();
}
function shell() {
  $('h-title').textContent = t('app.title'); $('lang').value = LANG;
  $('themebtn').textContent = t('theme.' + themeState());
  $('tabs').innerHTML = TABS.map(n => `<button class="${VIEW === n ? 'on' : ''}" onclick="show('${n}')">${t('tab.' + n)}</button>`).join('');
}
function show(v, rerender) {
  VIEW = v; shell();
  for (const n of TABS) $(n + '-view').hidden = v !== n;
  if (v === 'install') render();
  if (v === 'admin') renderAdmin(rerender ? false : !CACHE.status);
  if (v === 'containers') renderContainers(!CACHE.containers);
  if (v === 'help') renderHelp();
}

// ── Wizard frame ─────────────────────────────────────────────────────────────
function go(i) { W.step = i; markStep(); render(); }
// Commands executed while on a step: remember the history position when entering it.
async function markStep() { W.stepSince = (await api('/commands?since=999999999')).last || 0; }
const cmdsPanel = () => `<details class="card cmds" style="margin-top:14px" ontoggle="if(this.open)loadCmds(this)"><summary style="cursor:pointer"><b>${t('cmd.title')}</b> <span class="muted">${t('cmd.note')}</span></summary><div style="margin-top:8px"></div></details>`;
async function loadCmds(el) {
  const box = el.querySelector('div');
  const r = await api('/commands?since=' + (W.stepSince || 0));
  box.innerHTML = (r.commands || []).length ? r.commands.map(c => `<div style="margin-bottom:8px"><span class="muted">${new Date(c.t).toLocaleTimeString()} · ${esc(c.where)}</span>
    <pre class="log" style="margin-top:4px;max-height:220px">${esc(c.cmd)}</pre></div>`).join('') + `<button class="btn small" onclick="loadCmds(this.closest('details'))">${t('m.refresh')}</button>`
    : `<span class="muted">${t('cmd.none')}</span> <button class="btn small" onclick="loadCmds(this.closest('details'))">${t('m.refresh')}</button>`;
}
function next() { W.done.add(W.step); go(Math.min(W.step + 1, STEPS.length - 1)); }
function nav(canNext = true, label) {
  return `<div class="nav"><button class="btn" ${W.step ? '' : 'disabled'} onclick="go(${W.step - 1})">${t('nav.back')}</button>
    <button class="btn primary" ${canNext ? '' : 'disabled'} onclick="next()">${label || t('nav.next')}</button></div>`;
}
const setNav = (ok, label) => { const n = $('page').querySelector('.nav'); if (n) n.outerHTML = nav(ok, label); };
function render() {
  $('steps').innerHTML = STEPS.map(([k], i) => `<div class="${i === W.step ? 'on' : ''} ${W.done.has(i) ? 'done' : ''}" onclick="go(${i})"><span class="n">${W.done.has(i) ? '✓' : i + 1}</span>${t(k)}</div>`).join('');
  STEPS[W.step][1]();
  // Collapsed "terminal commands" panel at the end of every step (added once; steps replace #page content).
  if (!$('page').querySelector('.cmds')) $('page').insertAdjacentHTML('beforeend', cmdsPanel());
}
// Show/hide the passwords of the credentials table that contains the button.
function togglePw(btn) {
  const cells = btn.closest('.card').querySelectorAll('.secret'), show = btn.dataset.shown !== '1';
  cells.forEach(e => { e.textContent = show ? e.dataset.v : '••••••••'; });
  btn.dataset.shown = show ? '1' : '0'; btn.textContent = show ? t('a.hide') : t('a.show');
}

// Generic job runner: streams a job log into an element; handles __STEP__/__CHECK__/__REBOOT__/__EXIT__ lines.
function stream(id, onLine, onDone) {
  const es = new EventSource(`/api/jobs/${id}/stream`);
  es.onmessage = ev => { const line = JSON.parse(ev.data); onLine(line); if (line.startsWith('__EXIT__:')) { es.close(); onDone?.(line.endsWith(':0')); } };
  es.onerror = () => es.close();
}
async function runJob(endpoint, body, el, onDone) {
  el.innerHTML = '<div class="steplist"></div><pre class="log" style="margin-top:8px"></pre>';
  const list = el.querySelector('.steplist'), log = el.querySelector('pre'), steps = [];
  const j = await api(endpoint, body);
  if (!j.id) { log.textContent = j.error || 'error'; return; }
  stream(j.id, line => {
    if (line.startsWith('__STEP__ ')) { steps.push(line.slice(9)); list.innerHTML = steps.map((s, i) => `<div class="${i < steps.length - 1 ? 'done' : 'cur'}">${esc(s)}</div>`).join(''); return; }
    if (line.startsWith('__REBOOT__ ')) { list.insertAdjacentHTML('beforeend', `<p class="twarn"><b>${t('job.reboot')}:</b> ${esc(line.slice(11))}</p>`); return; }
    if (line.startsWith('__EXIT__:')) { list.querySelectorAll('div').forEach(d => d.className = 'done'); return; }
    log.textContent += line + '\n'; log.scrollTop = 1e9;
  }, ok => onDone?.(ok));
}

// ── 1 Welcome: detected installation + target and its provisioning ──────────
const TARGETS = ['wsl', 'desktop', 'hyperv', 'vbox', 'server', 'native'];
function welcome() {
  const st = CACHE.status, running = st?.containers?.filter(c => c.state === 'running').length || 0;
  const banner = st?.installed ? `<div class="banner"><div class="row"><span class="dot ${running ? 'ok' : 'warn'}"></span><b>${t('d.title')}</b>
      <span class="muted">— ${running ? t('d.running') : t('d.stopped')}</span>
      <button class="btn primary small right" onclick="show('admin')">${t('d.admin')}</button></div>
      <div class="muted" style="margin-top:6px">${t('d.text', { tag: esc(st.settings?.ELO_TAG || '?'), repo: esc(st.settings?.REPO || '?'), n: running, total: st.containers.length })} ${t('d.reinstall')}</div></div>` : '';
  $('page').innerHTML = `${banner}<h2>${t('w.title')}</h2><p class="lead">${t('w.lead')}</p>
  <div class="explain">${t('w.explain')}</div>
  <div class="card"><b>${t('w.need')}</b><ul>
    <li>${t('w.need1')}<button class="info" title="${esc(t('cli.title'))}" onclick="$('cli-help').hidden=!$('cli-help').hidden">i</button>
      <div id="cli-help" class="explain" hidden style="margin-top:8px"><b>${t('cli.title')}</b>${t('cli.steps')}</div></li>
    <li>${t('w.need2')}</li><li>${t('w.need3')}</li></ul><p class="muted">${t('w.platform')}</p></div>
  <div class="card"><b>${t('w.where')}</b><div class="grid2" style="margin-top:10px">${TARGETS.map(k => {
    // "This Linux machine" only when the installer itself runs on Linux.
    const off = k === 'native' && W.isWindows;
    return `<div class="card tcard ${W.target === k ? 'sel' : ''} ${off ? 'disabled' : ''}" ${off ? `title="${esc(t('t.native.win'))}"` : `onclick="pickTarget('${k}')"`}><b>${t('t.' + k)}</b>
      <div class="muted" style="margin-top:4px">${t(off ? 't.native.win' : 't.' + k + '.d')}</div></div>`; }).join('')}</div>
    <div id="tgt-extra" style="margin-top:14px"><span class="muted">${t('p.checking')}</span></div></div>` + nav(true, t('nav.start')) + cmdsPanel();
  targetExtra();
}
// The installation target only changes on an explicit click (never just by showing the page).
async function pickTarget(k) {
  const local = ['wsl', 'desktop', 'native'].includes(k);
  W.target = k;
  if (local) { const tg = await api('/target'); if (tg.mode === 'ssh') await api('/target', { kind: 'local' }); refreshEnv(); }
  welcome();
}
const stateDot = (ok, label) => `<span class="row" style="gap:6px"><span class="dot ${ok ? 'ok' : 'idle'}"></span>${label}</span>`;
async function targetExtra() {
  const el = $('tgt-extra'), k = W.target;
  const p = W.prov || (W.prov = await api('/provision/status'));
  const tg = await api('/target');
  if (k === 'native') { el.innerHTML = `<span class="muted">${t('p.current')}: ${esc(tg.mode)}</span>`; return; }
  if (k === 'wsl' || k === 'desktop') {
    const wslOk = !!p.wslDistro;
    let html = `<div class="row" style="gap:18px">${stateDot(p.wslFeature === 'Enabled', `${t('p.wsl')}: ${p.wslFeature === 'Enabled' ? t('p.enabled') : t('p.disabled')}`)}
      ${stateDot(wslOk, `${t('p.distro')}: ${esc(p.wslDistro || t('p.missing'))}`)}
      ${k === 'desktop' ? stateDot(p.dockerDesktop, `${t('p.desktop')}: ${p.dockerDesktop ? t('p.installed') : t('p.missing')}`) : ''}</div>`;
    if (!wslOk) html += `<div class="grid2" style="margin-top:12px">
      <div><label>${t('p.distro')}</label><select id="w-distro"><option value="Ubuntu-24.04">Ubuntu 24.04 LTS</option><option value="Debian">Debian</option></select></div>
      <div><label>${t('p.user')}</label><input type="text" id="w-user" value="elo"></div>
      <div><label>${t('p.password')}</label><input type="text" id="w-pass" class="pw" value="${rnd()}"></div>
      <div style="align-self:end"><button class="btn primary small" onclick="provWsl()">${t('p.installWsl')}</button></div></div>`;
    if (k === 'desktop') html += p.dockerDesktop ? `<p class="muted">${t('p.desktopHint')}</p>`
      : `<div style="margin-top:10px"><button class="btn primary small" onclick="provDesktop()">${t('p.installDesktop')}</button> <span class="muted">${t('p.desktopHint')}</span></div>`;
    el.innerHTML = html + '<div id="prov-job" style="margin-top:10px"></div>'; return;
  }
  if (k === 'hyperv' || k === 'vbox') {
    const ready = k === 'hyperv' ? p.hyperV === 'Enabled' : p.vbox;
    let html = `<div class="row" style="gap:18px">${k === 'hyperv'
      ? stateDot(ready, `${t('p.hyperv')}: ${ready ? t('p.enabled') : t('p.disabled')}`)
      : stateDot(ready, `${t('p.vbox')}: ${ready ? esc(p.vboxVersion || t('p.installed')) : t('p.missing')}`)}
      ${stateDot(!!p.wslDistro, `${t('p.distro')} (WSL): ${esc(p.wslDistro || t('p.missing'))}`)}</div>`;
    if (k === 'hyperv' && !ready) html += p.home ? `<p class="tbad">${t('p.home')}</p>` : `<div style="margin-top:10px"><button class="btn primary small" onclick="provJob('/provision/hyperv')">${t('p.enableHyperv')}</button></div>`;
    if (k === 'vbox' && !ready) html += `<div style="margin-top:10px"><button class="btn primary small" onclick="provJob('/provision/vbox')">${t('p.installVbox')}</button> <span class="muted">${t('p.vboxHint')}</span></div>`;
    // Windows Server (Hyper-V only): WSL2 + Ubuntu inside the VM runs Docker/ELO.
    const isos = k === 'hyperv' ? (W.isos || (W.isos = await api('/isos'))) : null;
    const evals = (isos?.isos || []).filter(i => i.id);
    const oses = [['ubuntu', 'Ubuntu 24.04 LTS'], ['debian', 'Debian 13'],
      ...evals.map(i => [i.id, `${i.label}${i.cached ? ' — ' + t('iso.inCache') : ''}${i.wsl2 ? '' : ' — ' + t('iso.noWsl2')}`])];
    if (k !== 'hyperv' && W.vm.distro.startsWith('ws')) W.vm.distro = 'ubuntu';
    const win = W.vm.distro.startsWith('ws'), cur = evals.find(i => i.id === W.vm.distro);
    // ISO choice: the cached evaluation ISO of the version (or download it), own ISOs in the cache folder, or a path.
    if (win && W.vm.isoChoice === undefined) W.vm.isoChoice = '';

const CORE = ['server', 'ix-setup', 'ix-import', 'search', 'tr2', 'as', 'flows', 'flows-worker'];
// ELO tags v<release>-<major>.<minor>[.<patch>][-suffix]: newest first (same rule as the backend).
const tagKey = tg => { const m = String(tg).match(/^v(\d+)-(\d+)(?:\.(\d+))?(?:\.(\d+))?(.*)$/); return m ? [1, +m[1], +m[2], +(m[3] || 0), +(m[4] || 0), m[5] ? 0 : 1, m[5]] : [0, 0, 0, 0, 0, 0, tg]; };
const compareTags = (a, b) => { const x = tagKey(a), y = tagKey(b); for (let i = 0; i < 6; i++) if (x[i] !== y[i]) return y[i] - x[i]; return String(x[6]).localeCompare(String(y[6])); };
const mark = x => x.local ? '●' : x.cached ? '◆' : '○';
function images() {
  if (!W.inv) { $('page').innerHTML = `<h2>${t('i.title')}</h2><p class="lead">${t('i.signinFirst')}</p>` + nav(false); return; }
  const repo = n => W.inv.repos.find(r => r.name === n);
  const tagsOf = n => (repo(n)?.tags || []).filter(x => /^v\d+-\d/.test(x.tag)).sort((a, b) => compareTags(a.tag, b.tag));
  // Keep the selection valid for this inventory (e.g. local-only lists).
  for (const [k, n] of [['ELO_TAG', 'server'], ['ELO_SEARCH_TAG', 'search']]) if (!tagsOf(n).some(x => x.tag === W.cfg[k]) && tagsOf(n)[0]) W.cfg[k] = tagsOf(n)[0].tag;
  const opt = (n, sel) => tagsOf(n).map(x => `<option ${x.tag === sel ? 'selected' : ''} value="${x.tag}">${mark(x)} ${x.tag}${x.size ? ' — ' + gb(x.size) : ''}${x.pushed ? ' — ' + x.pushed.slice(0, 10) : ''}${x.ix ? ' · IX ' + x.ix : ''}</option>`).join('');
  const chk = (k, label) => `<label><input type="checkbox" ${W.cfg[k] ? 'checked' : ''} onchange="W.cfg.${k}=this.checked;availability()"> ${t(label)}</label>`;
  $('page').innerHTML = `<h2>${t('i.title')}</h2><p class="lead">${W.inv.source === 'local' ? t('i.sourceLocal') : t('i.lead', { date: esc(W.inv.generated.slice(0, 16).replace('T', ' ')) })}</p>
  <div class="explain">${t('i.explain')}</div>
  <div class="card grid2">
    <div><label>${t('i.version')}</label><select onchange="W.cfg.ELO_TAG=this.value;availability()">${opt('server', W.cfg.ELO_TAG)}</select></div>
    <div><label>${t('i.search')}</label><select onchange="W.cfg.ELO_SEARCH_TAG=this.value;availability()">${opt('search', W.cfg.ELO_SEARCH_TAG)}</select></div>
    <div>${chk('as', 'i.as')}${chk('flows', 'i.flows')}${chk('pgadmin', 'i.pgadmin')}</div>
    <div class="muted" style="grid-column:1/-1">${t('i.legend')}</div>
  </div>
  <div class="card"><div class="row"><b>${t('i.avail')}</b><button class="btn small right" onclick="saveCache()">${t('i.saveCache')}</button></div>
    <div id="avail" style="margin-top:8px"></div><div id="cache-job"></div></div>
  <div class="card"><b>${t('i.all')}</b> <span class="muted">(${W.inv.repos.length})</span>
    <div class="tablewrap"><table><tr><th>${t('i.image')}</th><th>${t('i.latest')}</th><th>${t('i.size')}</th><th>${t('i.updated')}</th><th>${t('i.base')}</th><th>${t('i.pulls')}</th><th></th></tr>
    ${W.inv.repos.slice().sort((a, b) => (b.pulls || 0) - (a.pulls || 0)).map(r => { const x = r.tags[0] || {}; return `<tr><td><b>${esc(r.name)}</b>${CORE.includes(r.name) ? ` <span class="muted">${t('i.core')}</span>` : ''}</td>
      <td>${esc(x.tag || '—')}</td><td>${gb(x.size)}</td><td>${esc((x.pushed || '').slice(0, 10))}</td><td>${esc((x.base || '') + ' ' + (x.os || ''))}</td><td>${r.pulls ?? ''}</td>
      <td><a target="_blank" href="https://registry.elo.com/harbor/projects/2/repositories/${encodeURIComponent(r.name)}/artifacts-tab">registry ↗</a></td></tr>`; }).join('')}
    </table></div></div>` + nav(true);

// Per image of the selected version: in Docker (green), in the local cache (blue), or to download (grey).
function availability() {
  const el = $('avail'); if (!el) return;
  const svcs = ['server', 'ix-setup', 'ix-import', 'tr2', ...(W.cfg.as ? ['as'] : []), ...(W.cfg.flows ? ['flows', 'flows-worker'] : [])];

function install() {
  const c = W.cfg;
  $('page').innerHTML = `<h2>${t('n.title')}</h2><p class="lead">${t('n.lead')}</p><div class="explain">${t('n.explain')}</div>
  <div class="card"><div class="row"><b>ELO ${esc(c.ELO_TAG)}</b> · ${t('n.repo')} <b>${esc(c.REPO)}</b> · ${t('n.services')}: core${c.as ? ', as' : ''}${c.flows ? ', flows' : ''}${c.pgadmin ? ', pgAdmin' : ''}
    <button class="btn primary right" id="go" onclick="runInstall()">${t('n.now')}</button></div></div>
  <div class="card" id="inst" hidden><div class="progress"><div id="pbar"></div></div>
    <div class="grid2" style="margin-top:12px"><div class="steplist" id="slist"></div><div id="live" class="muted"></div></div>
    <pre class="log" id="ilog" style="margin-top:12px"></pre></div>` + nav(W.done.has(6));
}
async function runInstall() {
  const c = W.cfg, body = Object.fromEntries(Object.entries(c).filter(([k]) => /^[A-Z_]+$/.test(k)));
  body.COMPOSE_PROFILES = [c.as && 'as', c.flows && 'flows', c.pgadmin && 'pgadmin'].filter(Boolean).join(',') || 'none';
  body.ELO_DISPLAY_NAME = c.ELO_DISPLAY_NAME || c.REPO; body.fresh = c.fresh;
  $('go').disabled = true; $('inst').hidden = false;
  const j = await api('/install', body); if (!j.id) { $('ilog').textContent = j.error; $('go').disabled = false; return; }
  const steps = []; let pct = 3;
  stream(j.id, line => {
    if (line.startsWith('__STEP__ ')) { steps.push(line.slice(9)); pct = Math.min(95, pct + 14);
      $('slist').innerHTML = steps.map((s, i) => `<div class="${i < steps.length - 1 ? 'done' : 'cur'}">${esc(s)}</div>`).join(''); $('pbar').style.width = pct + '%'; return; }
    if (line.startsWith('__CHECK__ ')) { $('live').innerHTML = Object.entries(JSON.parse(line.slice(10))).map(([a, b]) => `${a}: <b>${esc(b)}</b>`).join(' · '); return; }
    if (line.startsWith('__EXIT__:')) return;
    $('ilog').textContent += line + '\n'; $('ilog').scrollTop = 1e9;
  }, ok => {
    $('pbar').style.width = '100%'; $('slist').innerHTML = steps.map(s => `<div class="done">${esc(s)}</div>`).join('');
    $('live').innerHTML += ok ? `<p class="tok">${t('n.done')}</p>` : `<p class="tbad">${t('n.failed')}</p>`;
    if (ok) { W.done.add(6); setNav(true); CACHE.status = null; } $('go').disabled = false;
  });
}

      <td><span class="dot ${on ? 'ok' : 'idle'}"></span> ${esc(x.status)}</td><td>${esc((x.mem || '').split('/')[0])}</td><td>${esc(x.cpu)}</td>
      <td class="muted" style="max-width:240px">${esc(x.ports)}</td><td class="muted">${esc(x.size)}</td>
      <td class="row">${on ? `<button class="btn small" onclick="ctr('restart','${esc(x.name)}')">${t('m.restart')}</button><button class="btn small" onclick="ctr('stop','${esc(x.name)}')">${t('m.stop')}</button>`
        : `<button class="btn small primary" onclick="ctr('start','${esc(x.name)}')">${t('m.start')}</button><button class="btn small" onclick="ctr('rm','${esc(x.name)}')">${t('k.remove')}</button>`}</td></tr>`; }).join('')}
    </table></div>` : `<span class="tbad">${esc(c.error)}</span>`}<pre class="log" id="k-out" hidden style="margin-top:10px"></pre></div>
  <div class="card"><div class="row"><b>${t('m.images')}</b><span class="muted">${(i.images || []).length}</span>
      <button class="btn small right" onclick="backupImgs(${esc(JSON.stringify((i.images || []).map(x => x.ref)))})">${t('m.backupAll')}</button></div>
    ${i.ok ? `<div class="tablewrap"><table><tr><th>${t('k.image')}</th><th>${t('k.size')}</th><th>${t('m.created')}</th><th>${t('m.usedBy')}</th><th></th></tr>
    ${i.images.map(x => `<tr><td>${esc(x.ref)}</td><td>${esc(x.size)}</td><td>${esc(x.created)}</td><td class="muted">${esc(x.usedBy.join(', ') || '—')}</td>
      <td class="row"><button class="btn small" onclick="backupImgs(['${esc(x.ref)}'])">${t('m.backup')}</button>
      <button class="btn small" ${x.usedBy.length ? `disabled title="${esc(t('m.inUse'))}"` : ''} onclick="rmImage('${esc(x.ref)}')">${t('m.delete')}</button></td></tr>`).join('')}</table></div>
`
    : `<span class="tbad">${esc(i.error)}</span>`}<div id="k-job"></div></div>
  <div class="card"><div class="row"><b>${t('k.cache')}</b><span class="muted">${t('k.cacheNote')}</span></div>
    <div class="row" style="margin:8px 0"><button class="btn small" onclick="openCache('cache')">📂 ${t('k.openCache')}</button>
      <button class="btn small" onclick="openCache('vmcache')">📂 ${t('k.openVmCache')}</button><span id="cache-msg" class="muted"></span></div>
    <b class="muted">${t('k.eloCache')}</b>
    ${i.ok && i.backups.length ? `<div class="tablewrap"><table><tr><th>${t('k.image')}</th><th>${t('k.size')}</th><th>${t('m.created')}</th><th></th></tr>
      ${i.backups.map(b => `<tr><td><span class="dot" style="background:var(--accent2)"></span> ${esc(b.ref)}</td><td>${gb(b.size)}</td><td>${esc(b.date)}</td>
        <td><button class="btn small" onclick="loadTar('${esc(b.file)}')">${t('k.load')}</button></td></tr>`).join('')}</table></div>` : `<p class="muted">${t('m.none')}</p>`}
    <b class="muted">${t('k.vmImages')}</b>
    ${i.vmImages?.length ? `<table>${i.vmImages.map(v => `<tr><td>${esc(v.file)}</td><td>${gb(v.size)}</td><td>${esc(v.date)}</td>
      <td>${/\.iso$/i.test(v.file) ? `<a class="btn small" href="/isos/${encodeURIComponent(v.file)}" download>${t('iso.save')}</a>` : ''}</td></tr>`).join('')}</table>` : `<p class="muted">${t('m.none')}</p>`}
  </div>`;
  renderSources();
}
// Configuration: cache sources (folder, network share, FTP/HTTP) searched before downloading from the registry.
async function renderSources() {
  const pg = $('containers-page'); if (!pg || $('src-card')) return;
  const c = await api('/config');
  pg.insertAdjacentHTML('beforeend', `<div class="card" id="src-card"><b>${t('src.title')}</b><p class="muted" style="margin:4px 0">${t('src.note')}</p>
    <textarea id="src-list" rows="4" style="font-family:var(--mono)" placeholder="\\\\server\\share\\elo-images&#10;D:\\elo-images&#10;ftp://user:password@ftp.example.com/elo&#10;https://mirror.example.com/elo">${esc((c.raw || []).join('\n'))}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn small primary" onclick="saveSources()">${t('src.save')}</button>
      <button class="btn small" onclick="checkSources()">${t('src.check')}</button><span id="src-msg" class="muted"></span></div>
    <pre class="log" id="src-out" hidden style="margin-top:8px"></pre></div>`);
}
async function saveSources() {
  const r = await api('/config', { cacheSources: $('src-list').value.split('\n') });
  $('src-msg').innerHTML = r.ok ? `<span class="tok">✓ ${t('src.saved', { n: r.count })}</span>` : `<span class="tbad">${esc(r.error)}</span>`;
}
async function checkSources() {
  await saveSources(); $('src-msg').textContent = t('m.working');
  const r = await api('/cache/sources', {}), o = $('src-out'); o.hidden = false;
  o.textContent = r.ok ? r.lines.join('\n') : r.error;
  $('src-msg').textContent = r.ok ? t('src.result', { found: r.found, total: r.total }) : '';
}
async function openCache(what) { $('cache-msg').textContent = t('m.opening'); const r = await api('/open', { what }); $('cache-msg').textContent = r.ok ? (r.path || r.linuxPath) + (r.note ? ' — ' + r.note : '') : r.error; }
const kOut = txt => { const o = $('k-out'); if (o) { o.hidden = false; o.textContent = txt; } };
async function ctr(action, name) { kOut(t('m.working')); const r = await api('/container', { action, name }); kOut(r.ok ? r.out : r.error); CACHE.status = null; renderContainers(true); }
async function rmImage(ref) { const r = await api('/images/remove', { refs: [ref] }); kOut(r.ok ? r.out : r.error); renderContainers(true); }
function backupImgs(refs) { runJob('/backup', { images: [...new Set(refs)] }, $('k-job'), () => renderContainers(true)); }
function loadTar(file) { runJob('/images/load', { file }, $('k-job'), () => renderContainers(true)); }

// ── Help ─────────────────────────────────────────────────────────────────────
async function renderHelp() {
  const d = await api('/docs');
  $('help-page').innerHTML = `<h2>${t('h.title')}</h2><p class="lead">${t('h.lead')}</p>
  <div class="card"><b>${t('h.files')}</b> <span class="muted">${t('h.filesNote')}</span>
    <table>${(d.local || []).map(f => `<tr><td><a target="_blank" href="${esc(f.url)}">${esc(f.name)}</a></td><td class="muted">${esc(f.where)}</td></tr>`).join('') || `<tr><td class="muted">${t('m.none')}</td></tr>`}</table></div>
  <div class="card"><b>${t('cli.title')}</b>${t('cli.steps')}</div>
  <div class="card"><b>${t('h.online')}</b> <span class="muted">${t('h.onlineNote')}</span>
    <table>${(d.online || []).map(f => `<tr><td>${esc(f.name)}</td><td><a target="_blank" href="${esc(f.url)}">${esc(f.url)}</a></td></tr>`).join('')}</table></div>
  <div class="card"><b>${t('h.how')}</b><ul>${[1, 2, 3, 4, 5].map(n => `<li>${t('h.how' + n)}</li>`).join('')}</ul></div>`;
}

// ── Start: environment + detection of an existing installation ──────────────
async function refreshEnv() { const e = await api('/target'); $('envinfo').textContent = e.ok ? `${e.mode}${e.distro ? ' · ' + e.distro : ''}${e.target ? ' · ' + e.target.user + '@' + e.target.host : ''}` : ''; }
(async () => {
  document.documentElement.lang = LANG; shell();
  const tg = await api('/target');               // start on the current target (e.g. a VM over SSH)
  W.isWindows = !!tg.isWindows;
  if (tg.mode === 'ssh') W.target = tg.target.kind || 'server';
  else if (tg.mode === 'linux') W.target = 'native';
  render(); refreshEnv();
  await loadStatus();                       // detected installation → banner on the welcome page
  if (VIEW === 'install' && W.step === 0) welcome();
})();
</script>
</body>
